name: Project checks
on: [push, pull_request]
jobs:
  verify:
    # The test fixture pins MongoDB 7.0.14, which has an Ubuntu 22.04 binary,
    # but no Ubuntu 24.04 binary. Keep the runner compatible with that fixture.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run build
        env:
          # Browser tests use local API fixtures, never the deployed API.
          VITE_API_URL: /api/v1
      - run: npm test
      - run: npm test --prefix server
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
        env:
          YARDPILOT_TEST_BUILD: '1'
